<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Loading... - Pranav Pipariya</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../theme.css" />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
        <script src="post-extras.js"></script>
    </head>

    <body>
        <main class="container">
            <header>
                <h1 class="name">Pranav Pipariya</h1>

                <nav class="nav">
                    <a href="../index.html">Home</a>
                    <a href="index.html">Blog</a>
                    <a href="../work.html">Work</a>
                    <a href="../connect.html">Connect</a>
                </nav>

                <div class="divider">
                    ................................................................................
                </div>
            </header>

            <article class="content" id="post-content">
                <p>Loading post...</p>
            </article>

            <div class="post-footer">
                <a href="index.html">← Back to blog</a>
            </div>
        </main>

        <script>
            // Get post filename from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const postFile = urlParams.get('post');

            if (!postFile) {
                document.getElementById('post-content').innerHTML = '<p>No post specified.</p>';
            } else {
                // Fetch and render the markdown file
                fetch(`posts/${postFile}.md`)
                    .then(response => {
                        if (!response.ok) throw new Error('Post not found');
                        return response.text();
                    })
                    .then(markdown => {
                        // Parse frontmatter (title, date, excerpt)
                        const frontmatterMatch = markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);

                        let title = 'Blog Post';
                        let date = '';
                        let content = markdown;

                        if (frontmatterMatch) {
                            const frontmatter = frontmatterMatch[1];
                            content = frontmatterMatch[2];

                            const titleMatch = frontmatter.match(/title:\s*(.+)/);
                            const dateMatch = frontmatter.match(/date:\s*(.+)/);

                            if (titleMatch) title = titleMatch[1].trim();
                            if (dateMatch) date = dateMatch[1].trim();
                        }

                        // Update page title
                        document.title = `${title} - Pranav Pipariya`;

                        // Render markdown
                        const html = marked.parse(content);

                        // Add post header with metadata
                        let postHTML = '<div class="post-header">';
                        if (date) {
                            postHTML += `<div class="post-meta"><time datetime="${date}">${formatDate(date)}</time></div>`;
                        }
                        postHTML += '</div>';
                        postHTML += html;

                        document.getElementById('post-content').innerHTML = postHTML;
                        if (window.enhancePost) enhancePost(document.getElementById('post-content'));
                    })
                    .catch(error => {
                        document.getElementById('post-content').innerHTML =
                            '<p>Error loading post. <a href="index.html">Return to blog</a></p>';
                    });
            }

            function formatDate(dateStr) {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }
        </script>
    </body>
</html>
